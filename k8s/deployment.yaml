
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-asssessment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-asssessment
  template:
    metadata:
      labels:
        app: k8s-asssessment
    spec:
      containers:
        - name: student-k8s-demo
          image: chaostemptemptemp/k8s-asssessment:065460248ff042b88871157d4ba30c592fc446a5
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
