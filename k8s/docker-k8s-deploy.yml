name: Docker Build and Kubernetes Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: k8s-assessment
  IMAGE_TAG: ${{ github.sha }}
  DOCKER_HUB_REPO: docker.io/${{ secrets.DOCKER_USERNAME }}/k8s-assessment
  K8S_NAMESPACE: default

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_HUB_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_HUB_REPO }}:latest

  deploy-to-kubernetes:
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      - name: Configure Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config current-context
          kubectl get nodes

      - name: Deploy app to Kubernetes
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/k8s-assessment -n ${{ env.K8S_NAMESPACE }} --timeout=180s

      - name: Update deployment image
        run: |
          kubectl set image deployment/k8s-assessment \
            student-k8s-demo=${{ env.DOCKER_HUB_REPO }}:${{ env.IMAGE_TAG }} \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/k8s-assessment -n ${{ env.K8S_NAMESPACE }} --timeout=180s

      - name: Show app status
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}